<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="HTML Studio：在浏览器里编辑 HTML、保留动效，并导出可运行的页面。"
    />
    <title>HTML Studio · 可视化编辑器</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="is-home">
      <header class="topbar">
        <button
          class="brand"
          id="main-menu-button"
          aria-label="文件菜单"
          title="文件菜单"
        >
          <span class="brand-mark">H</span
          ><span class="brand-name">html全能编辑器</span
          ><span class="chevron">⌄</span>
        </button>
        <span class="top-divider"></span
        ><input
          id="document-name"
          class="document-name"
          aria-label="文档名称"
          value="未打开文件"
          disabled
        /><span class="version-tag">0.5.0</span>
        <span id="save-indicator" class="save-indicator">尚未打开文件</span>
        <div class="top-actions">
          <button
            id="undo"
            disabled
            class="icon-button"
            title="撤回 ⌘/Ctrl Z"
            aria-label="撤回"
            data-icon="undo"
          ></button
          ><button
            id="redo"
            disabled
            class="icon-button"
            title="重做 ⌘/Ctrl ⇧ Z"
            aria-label="重做"
            data-icon="redo"
          ></button
          ><span class="top-divider"></span
          ><button id="agent-connect" class="text-button" title="连接电脑上的 Agent">连接 AI</button
          ><button id="new-template-button" class="text-button" data-leading="grid" title="从模板新建 HTML">
            从模板新建</button
          ><button id="import-button" class="text-button" data-leading="import">
            导入</button
          ><button id="save-button" class="text-button" data-leading="save" disabled>
            保存工程</button
          ><button id="preview-button" class="text-button" data-leading="play" disabled>
            预览</button
          ><button
            id="export-button"
            disabled
            class="primary-button"
            data-leading="export"
          >
            导出 HTML
          </button>
        </div>
      </header>
      <div class="workspace">
        <aside class="left-panel" inert>
          <div class="panel-tabs">
            <button class="tab active" data-left-tab="layers">图层</button
            ><button class="tab" data-left-tab="insert">插入</button
            ><button id="layer-actions" class="icon-button" aria-label="图层操作" title="图层操作" aria-haspopup="menu">•••</button><button
              class="icon-button panel-help"
              id="help-button"
              aria-label="使用帮助"
              title="使用帮助"
              data-icon="help"
            ></button>
          </div>
          <section id="page-navigation" hidden aria-label="演示页面导航">
            <div class="page-navigation-heading"><span>演示页面</span><span id="page-count" aria-live="polite"></span></div>
            <select id="page-select" aria-label="选择编辑页码"></select>
            <div class="page-navigation-actions">
              <button id="page-previous" aria-label="上一页">← 上一页</button>
              <button id="page-next" aria-label="下一页">下一页 →</button>
            </div>
            <button id="manage-pages" class="full-button" title="页面排序、新增、复制和删除">管理页面 · 排序 / 增删</button>
          </section>
          <section id="layers-pane">
            <div class="page-row">
              <span data-icon="page"></span><strong id="layer-page-label">暂无页面</strong
              ><span class="muted">HTML</span>
            </div>
            <div class="layer-search">
              <span data-icon="search"></span
              ><input
                id="layer-search"
                placeholder="查找图层"
                aria-label="查找图层"
              /><span class="key-hint">⌕</span>
            </div>
            <div id="layer-list" role="tree" aria-label="图层"></div>
          </section>
          <section id="insert-pane" hidden>
            <p class="insert-label">基础元素</p>
            <div id="insert-grid" class="insert-grid"></div>
            <p class="insert-label">资源</p>
            <button id="insert-image" class="asset-button" data-leading="image">
              导入图片</button
            ><button id="insert-svg" class="asset-button" data-leading="vector">
              导入 SVG
            </button>
            <button id="insert-video" class="asset-button">插入视频文件</button>
            <p class="insert-label">数据</p>
            <button class="asset-button" data-insert-data="table">插入表格</button>
            <div class="insert-grid">
              <button class="insert-card" data-insert-data="bar">柱状图</button>
              <button class="insert-card" data-insert-data="line">折线图</button>
              <button class="insert-card" data-insert-data="pie">饼图</button>
            </div>
            <p class="panel-note">
              先选工具，再点击画布插入。<br />按 Shift 可连续选择多个图层。
            </p>
          </section>
        </aside>
        <main class="canvas-area">
          <section id="start-screen" class="start-screen" aria-labelledby="start-title">
            <div class="start-card">
              <span class="start-mark" data-icon="page"></span>
              <h1 id="start-title">开始编辑 HTML</h1>
              <p>打开 HTML 或工程文件，也可以从模板新建。</p>
              <div class="start-actions">
                <button id="start-import-button" class="primary-button" data-leading="import">导入 HTML / 工程</button>
                <button id="start-template-button" class="text-button" data-leading="grid">从模板新建</button>
              </div>
              <button id="restore-draft-button" class="text-button restore-draft-button" hidden>恢复上次草稿</button>
              <small>文件在本机处理 · 支持拖入 HTML 或工程文件</small>
              <button id="usage-license-button" class="text-button" type="button">免费个人非商业使用 · 查看许可</button>
            </div>
          </section>
          <div class="canvas-toolbar">
            <div class="breadcrumb">
              <span data-icon="page"></span
              ><span id="canvas-title">开始</span
              ><span class="breadcrumb-slash">/</span
              ><span id="mode-label">设计</span>
            </div>
            <div class="viewport-controls">
              <button id="font-status" class="compatibility-button" title="模板字体与离线缓存">字体已就绪</button>
              <button id="compatibility-button" class="compatibility-button" title="检查当前文件的编辑与预览限制">兼容性检查</button>
              <button
                id="desktop-size"
                class="icon-button active"
                title="桌面画布 1080px"
                aria-label="桌面画布"
                data-icon="desktop"
              ></button
              ><button
                id="mobile-size"
                class="icon-button"
                title="手机画布 390px"
                aria-label="手机画布"
                data-icon="mobile"
              ></button
              ><span class="toolbar-divider"></span
              ><button
                id="zoom-out"
                class="icon-button"
                aria-label="缩小"
                data-icon="minus"
              ></button
              ><button id="zoom-label" class="zoom-label" title="点击适合画布">
                75%</button
              ><button
                id="zoom-in"
                class="icon-button"
                aria-label="放大"
                data-icon="plus"
              ></button>
            </div>
          </div>
          <div
            id="canvas-scroll"
            class="canvas-scroll"
            tabindex="0"
            aria-label="设计画布"
          >
            <div id="surface-shell">
              <div id="surface">
                <div class="artboard-label">
                  <span id="artboard-name">Desktop</span
                  ><span id="artboard-size">1080 × 820</span>
                </div>
                <div id="artboard">
                  <iframe
                    id="edit-frame"
                    title="编辑画布"
                    sandbox="allow-same-origin"
                  ></iframe
                  ><iframe
                    id="preview-frame"
                    title="动效预览"
                    sandbox="allow-scripts"
                    hidden
                  ></iframe>
                  <div id="overlay"></div>
                </div>
              </div>
            </div>
          </div>
          <div id="preview-banner" hidden>
            <span class="pulse-dot"></span><span id="preview-status" role="status">预览中不可选中编辑，请先返回编辑</span><button id="preview-details">预览诊断</button><button
              id="restart-preview"
              data-leading="restart"
            >
              重新播放</button
            ><button id="preview-fullscreen" type="button" aria-pressed="false">全屏显示</button
            ><button id="exit-preview">返回编辑 <kbd>Esc</kbd></button>
          </div>
          <div class="floating-tools" role="toolbar" aria-label="画布工具">
            <button
              data-tool="select"
              class="tool active"
              title="选择 V"
              aria-label="选择"
              data-icon="cursor"
            ></button
            ><button
              data-tool="hand"
              class="tool"
              title="抓手 H / 按住空格"
              aria-label="抓手"
              data-icon="hand"
            ></button
            ><span></span
            ><button
              data-tool="frame"
              class="tool"
              title="容器 F"
              aria-label="容器"
              data-icon="frame"
            ></button
            ><button
              data-tool="rect"
              class="tool"
              title="矩形 R"
              aria-label="矩形"
              data-icon="rect"
            ></button
            ><button
              data-tool="ellipse"
              class="tool"
              title="椭圆 O"
              aria-label="椭圆"
              data-icon="ellipse"
            ></button
            ><button
              data-tool="line"
              class="tool"
              title="线条 L"
              aria-label="线条"
              data-icon="line"
            ></button
            ><button
              data-tool="text"
              class="tool"
              title="文本 T"
              aria-label="文本"
              data-icon="text"
            ></button
            ><span></span
            ><button
              id="more-insert"
              class="tool"
              title="更多元素"
              aria-label="更多元素"
              data-icon="plus"
            ></button>
          </div>
          <div class="canvas-footer">
            <span id="selection-status"
              >点击元素开始编辑 · Shift 多选 · 空格拖动画布</span
            ><span id="motion-status">编辑时动效已暂停</span>
          </div>
        </main>
        <aside class="right-panel" inert>
          <div class="panel-tabs">
            <button class="tab active" id="design-tab">设计</button
            ><button class="tab" id="source-button">代码</button
            ><span class="right-tab-caption">属性</span>
          </div>
          <div id="inspector"></div>
        </aside>
      </div>
    </div>
    <div id="menu" class="dropdown" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="drop-overlay" hidden>
      <span data-icon="import"></span>
      <h2>拖入 HTML、工程或资源</h2>
      <p>支持 .html · .htmlstudio · .svg · 图片 · 视频</p>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button
          id="dialog-close"
          class="icon-button"
          aria-label="关闭"
          data-icon="close"
        ></button>
      </div>
      <div id="dialog-body"></div>
      <div id="dialog-actions"></div>
    </dialog>
    <input
      type="file"
      id="file-input"
      accept=".html,.htm,.htmlstudio,.json"
      hidden
    /><input
      type="file"
      id="folder-input"
      webkitdirectory
      multiple
      hidden
    /><input type="file" id="image-input" accept="image/*" hidden /><input
      type="file"
      id="svg-input"
      accept=".svg,image/svg+xml"
      hidden
    />
    <input type="file" id="video-input" accept="video/*,.mp4,.webm,.ogv,.mov,.m4v" hidden />

    <script type="module" src="./app.js"></script>
  </body>
</html>
